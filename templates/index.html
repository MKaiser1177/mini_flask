<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Weather Conditions</title>
    <link href="{{ url_for('static', filename='styles/styles.css') }}" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root">
        <noscript>
            <div class="weather-card">
                <h1>Get Weather Conditions</h1>
                <form action="/weather" class="weather-form">
                    <input type="text" name="city" id="city" placeholder="Enter a City" class="weather-input" />
                    <button type="submit" class="weather-btn">Submit</button>
                </form>
            </div>
        </noscript>
    </div>

    <script type="text/babel">
        function App() {
            const [city, setCity] = React.useState("");

            return (
                <div className="weather-card">
                    <div className="app-header">
                        <div className="weather-icon-badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <circle cx="12" cy="12" r="5" />
                                <line x1="12" y1="1" x2="12" y2="3" />
                                <line x1="12" y1="21" x2="12" y2="23" />
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                                <line x1="1" y1="12" x2="3" y2="12" />
                                <line x1="21" y1="12" x2="23" y2="12" />
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                            </svg>
                        </div>
                        <h1 className="app-title">Weather Forecast</h1>
                        <p className="app-subtitle">Check real-time weather conditions anywhere</p>
                    </div>

                    <form action="/weather" method="GET" className="weather-form">
                        <input
                            type="text"
                            name="city"
                            id="city"
                            className="weather-input"
                            placeholder="Enter a City"
                            value={city}
                            onChange={(e) => setCity(e.target.value)}
                            required
                            autoFocus
                        />
                        <button type="submit" className="weather-btn">
                            Get Weather
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
