<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Not Found</title>
    <link href="{{ url_for('static', filename='styles/styles.css') }}" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root">
        <noscript>
            <div class="weather-card">
                <h1>City Not Found</h1>
                <h2>Try Again?</h2>
                <form action="/weather">
                    <input type="text" name="city" id="city" placeholder="Enter a City" />
                    <button type="submit">Submit</button>
                </form>
            </div>
        </noscript>
    </div>

    <script type="text/babel">
        function App() {
            const [city, setCity] = React.useState("");

            return (
                <div className="weather-card">
                    <div className="app-header">
                        <div className="error-badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <line x1="15" y1="9" x2="9" y2="15" />
                                <line x1="9" y1="9" x2="15" y2="15" />
                            </svg>
                        </div>
                        <h1 className="app-title">City Not Found</h1>
                        <p className="error-message">We couldn't locate weather details for that place. Would you like to try another city?</p>
                    </div>

                    <form action="/weather" method="GET" className="weather-form">
                        <input
                            type="text"
                            name="city"
                            id="city"
                            className="weather-input"
                            placeholder="Try another city..."
                            value={city}
                            onChange={(e) => setCity(e.target.value)}
                            required
                            autoFocus
                        />
                        <button type="submit" className="weather-btn">
                            Search Again
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
